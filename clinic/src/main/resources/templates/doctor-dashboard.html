<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctor Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <!-- === START: โค้ดที่นำมาจาก patient-home.html === -->
    <style>
        /* --- Light Mode (Default) --- */
        body {
            min-height: 100vh;
            font-family: "Segoe UI", sans-serif;
            color: #212529;
            background: linear-gradient(-45deg, #e3f2fd, #bbdefb, #90caf9, #64b5f6);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            transition: background 0.5s, color 0.5s;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .navbar {
            background: linear-gradient(90deg, #1565c0, #42a5f5);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }
        .navbar-brand { color: #fff !important; font-weight: bold; }
        .nav-link { color: #f1f1f1 !important; font-weight: 500; position: relative; }
        .btn-toggle { background: #fff; color: #1565c0; border-radius: 20px; margin-left: 10px; padding: 6px 16px; font-weight: bold; transition: all 0.3s ease; }
        .footer { margin-top: 50px; background: rgba(21,101,192,0.8); color: white; text-align: center; padding: 20px 0; }
        
        /* --- Styles for Table --- */
        .table-container { 
            background: rgba(255, 255, 255, 0.9); 
            border-radius: 15px; 
            padding: 30px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); 
            margin-top: 120px; 
        }
        table { border-radius: 10px; overflow: hidden; }
        thead { background: #1565c0; color: #fff; }
        tbody tr:hover { background: #e3f2fd; transition: 0.3s; }

        /* --- Dark Mode Styles --- */
        body.dark-mode {
            color: #e0e0e0;
            background: linear-gradient(-45deg, #0d47a1, #1565c0, #1e88e5, #0a3a75);
            background-size: 400% 400%;
        }
        body.dark-mode .navbar {
            background: linear-gradient(90deg, #0d47a1, #1976d2);
        }
        body.dark-mode .footer { background: rgba(13, 71, 161, 0.8); }
        body.dark-mode .table-container { 
            background-color: rgba(28, 40, 51, 0.85); 
            backdrop-filter: blur(5px); 
        }
        body.dark-mode thead { background: #0d47a1; }
        body.dark-mode tbody tr { color: #e0e0e0; }
        body.dark-mode tbody tr:hover { background: #263238; }
        body.dark-mode .text-primary { color: #bbdefb !important; }

    </style>
    <!-- === END: โค้ดที่นำมา === -->
</head>
<body>

<!-- สคริปต์ตรวจสอบ Theme ตอนโหลดหน้า -->
<script>
    (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    })();
</script>

<!-- Navbar สำหรับแพทย์ -->
<nav class="navbar navbar-expand-lg fixed-top animate__animated animate__fadeInDown">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/doctor/home}">
             <img th:src="@{/images/DoctorHeart.png}" alt="My Clinic Logo" style="height: 45px; width: auto;">
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                <li class="nav-item">
                    <span class="navbar-text text-white me-3">
                        Welcome, <strong th:text="${doctorName}">Doctor</strong>!
                    </span>
                </li>
                <li class="nav-item">
                    <a th:href="@{/logout}" class="nav-link">Logout</a>
                </li>
                <li class="nav-item">
                    <button class="btn btn-toggle mt-2 mt-lg-0" onclick="toggleDarkMode()">🌙 Dark Mode</button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content: ตารางนัดหมาย -->
<div class="container table-container animate__animated animate__fadeIn" data-aos="fade-up">
    <h2 class="text-center mb-4 text-primary">📅 Your Appointments</h2>
    
    <div class="table-responsive">
        <table class="table table-hover align-middle text-center">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Patient Name</th>
                    <th>Date & Time</th>
                    <th>Symptoms</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(appointments)}">
                    <td colspan="6" class="text-center py-4">No appointments found.</td>
                </tr>
                <tr th:each="appt : ${appointments}">
                    <td th:text="${appt.id}"></td>
                    <td th:text="${appt.patientName}"></td>
                    <td th:text="${appt.formattedAppointmentDate}"></td>
                    <td th:text="${appt.symptoms}"></td>
                    <td>
                        <span class="badge bg-warning text-dark" th:if="${appt.status == 'BOOKED'}" th:text="${appt.status}"></span>
                        <span class="badge bg-success" th:if="${appt.status == 'COMPLETED'}" th:text="${appt.status}"></span>
                        <span class="badge bg-danger" th:if="${appt.status == 'CANCELLED'}" th:text="${appt.status}"></span>
                    </td>
                    <td>
                        <div th:if="${appt.status == 'BOOKED'}">
                            <form th:action="@{/doctor/update-status}" method="post" style="display: inline-block; margin-right: 5px;">
                                <input type="hidden" name="appointmentId" th:value="${appt.id}" />
                                <button type="submit" class="btn btn-success btn-sm">Complete</button>
                            </form>
                            <form th:action="@{/doctor/appointments/cancel}" method="post" style="display: inline-block;">
                                <input type="hidden" name="appointmentId" th:value="${appt.id}" />
                                <button type="submit" class="btn btn-danger btn-sm"
                                        onclick="return confirm('Are you sure you want to cancel this appointment?')">
                                    Cancel
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Footer -->
<div class="footer">
    <p>&copy; 2025 My Clinic. All Rights Reserved.</p>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

<!-- Toastify Notification Script -->
<script th:if="${successMessage}">
    Toastify({
        text: "✅ " + "[[${successMessage}]]",
        duration: 3000,
        gravity: "top",
        position: "center",
        style: { background: "linear-gradient(to right, #00b09b, #96c93d)" }
    }).showToast();
</script>

<!-- Dark Mode Script -->
<script>
    AOS.init({ duration: 1000, once: true });
    
    const toggleButton = document.querySelector('.btn-toggle');
    const rootElement = document.documentElement;

    function toggleDarkMode() {
        rootElement.classList.toggle('dark-mode');
        let theme = rootElement.classList.contains('dark-mode') ? 'dark' : 'light';
        localStorage.setItem('theme', theme);
        updateButtonText();
    }

    function updateButtonText() {
        if (rootElement.classList.contains('dark-mode')) {
            toggleButton.innerHTML = "☀️ Light Mode";
        } else {
            toggleButton.innerHTML = "🌙 Dark Mode";
        }
    }

    document.addEventListener('DOMContentLoaded', updateButtonText);
</script>

</body>
</html>
