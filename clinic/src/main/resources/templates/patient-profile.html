<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <!-- CSS Links (Bootstrap, Animate, AOS, Toastify) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <!-- Style จากหน้า patient-home -->
    <style>
        body {
            min-height: 100vh;
            font-family: "Segoe UI", sans-serif;
            color: #333;
            background: linear-gradient(-45deg, #2196f3, #1976d2, #42a5f5, #0d47a1);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .navbar { background: linear-gradient(90deg, #1565c0, #42a5f5); box-shadow: 0 3px 10px rgba(0,0,0,0.2); }
        .navbar-brand { color: #fff !important; font-weight: bold; }
        .nav-link { color: #f1f1f1 !important; font-weight: 500; position: relative; }
        .nav-link::after { content: ""; position: absolute; width: 0%; height: 2px; left: 0; bottom: -5px; background: #fff; transition: 0.3s; }
        .nav-link:hover::after { width: 100%; }
        .card { border: none; border-radius: 15px; }
        .footer { margin-top: 50px; background: rgba(21,101,192,0.9); color: white; text-align: center; padding: 20px 0; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg fixed-top animate__animated animate__fadeInDown">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/patient/home}">
             <img th:src="@{/images/DoctorHeart.png}" alt="My Clinic Logo" style="height: 45px; width: auto;">
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                <li class="nav-item"><a th:href="@{/patient/home}" class="nav-link">Home</a></li>
                <li class="nav-item"><a th:href="@{/patient/appointments}" class="nav-link">My Appointments</a></li>
                <li class="nav-item"><a th:href="@{/logout}" class="nav-link">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container" style="margin-top: 120px;">
    <div class="row g-4">
        <!-- Edit Profile Card -->
        <div class="col-lg-6">
            <div class="card shadow-lg p-4 h-100 animate__animated animate__fadeInLeft">
                <div class="card-body">
                    <h3 class="card-title text-primary mb-4">Edit Profile</h3>
                    <form th:action="@{/profile/patient/update}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" id="username" class="form-control" th:value="${patient.user.username}" disabled readonly>
                        </div>
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" id="name" name="name" class="form-control" th:value="${patient.name}" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="tel" id="phone" name="phone" class="form-control" th:value="${patient.phone}" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 mt-2">Update Profile</button>
                    </form>

                    <!-- === START: โค้ดที่ย้ายมา === -->
                    <div class="text-center mt-4 text-muted small">
                        <p>If you wish to deactivate your account, please contact our clinic staff.</p>
                    </div>
                    <!-- === END: โค้ดที่ย้ายมา === -->
                </div>
            </div>
        </div>

        <!-- Change Password Card -->
        <div class="col-lg-6">
            <div class="card shadow-lg p-4 h-100 animate__animated animate__fadeInRight">
                <div class="card-body">
                    <h3 class="card-title text-primary mb-4">Change Password</h3>
                    <form th:action="@{/profile/password/change}" method="post">
                        <div class="mb-3">
                            <label for="oldPassword" class="form-label">Old Password</label>
                            <input type="password" id="oldPassword" name="oldPassword" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">New Password</label>
                            <input type="password" id="newPassword" name="newPassword" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm New Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-2">Change Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div class="footer">
    <p>&copy; 2025 My Clinic. All Rights Reserved.</p>
</div>

<!-- Scripts (Toastify) -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script th:if="${successMessage}">
    Toastify({
        text: "✅ " + "[[${successMessage}]]",
        duration: 3000,
        gravity: "top",
        position: "center",
        style: { background: "linear-gradient(to right, #00b09b, #96c93d)" }
    }).showToast();
</script>
<script th:if="${errorMessage}">
    Toastify({
        text: "❌ " + "[[${errorMessage}]]",
        duration: 3000,
        gravity: "top",
        position: "center",
        style: { background: "linear-gradient(to right, #ff5f6d, #ffc371)" }
    }).showToast();
</script>
</body>
</html>
